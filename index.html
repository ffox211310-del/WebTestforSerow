<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>wllama Qwen2.5 Test</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 10px;
    }

    #statusBox {
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    #statusTitle {
      font-weight: bold;
      margin-bottom: 8px;
    }

    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: monospace;
      font-size: 13px;
      color: #333;
    }

    #progressContainer {
      width: 100%;
      height: 8px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
    }

    #progress {
      width: 0%;
      height: 100%;
      background: #333;
      transition: width 0.2s;
    }

    #chat {
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      min-height: 300px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      margin: 12px 0;
      font-weight: bold;
    }

    .assistant {
      margin: 12px 0 20px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 15px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
    }

    button {
      margin-top: 10px;
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <h1>wllama + Qwen2.5</h1>

  <div id="statusBox">

    <div id="statusTitle">
      ステータス
    </div>

    <div id="status">
      起動しています...
    </div>

    <div id="progressContainer">
      <div id="progress"></div>
    </div>

  </div>

  <div id="chat"></div>

  <textarea
    id="input"
    rows="3"
    placeholder="メッセージを入力..."
    disabled
  ></textarea>

  <button id="send" disabled>
    送信
  </button>

  <script type="module" src="./app.js"></script>

</body>
</html>
