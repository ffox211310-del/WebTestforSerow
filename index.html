<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>wllama Qwen2.5 Test</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    #status {
      padding: 10px;
      background: #eee;
      border-radius: 8px;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }

    #chat {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      min-height: 300px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      margin: 12px 0;
      font-weight: bold;
    }

    .assistant {
      margin: 12px 0 20px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 15px;
      padding: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      padding: 10px 18px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>wllama + Qwen2.5</h1>

  <div id="status">wllamaを準備中...</div>

  <div id="chat"></div>

  <textarea
    id="input"
    rows="3"
    placeholder="メッセージを入力..."
    disabled
  ></textarea>

  <button id="send" disabled>送信</button>

  <script type="module" src="./app.js"></script>

</body>
</html>
