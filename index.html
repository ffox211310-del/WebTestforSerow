<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen2.5-0.5B-Instruct サンプル (Transformers.js)</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #6ea8fe;
    --user-bubble: #2a3550;
    --bot-bubble: #22252c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; margin: 0 0 4px; }
  header .model-id { font-size: 12px; color: var(--muted); }
  #status {
    font-size: 12px;
    color: var(--muted);
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 12px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 2px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 2px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; background: none; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
  }
  button {
    background: var(--accent);
    color: #0b0f1a;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>Qwen2.5-1.5B-Instruct サンプル</h1>
  <div class="model-id">onnx-community/Qwen2.5-0.5B-Instruct · Transformers.js</div>
</header>

<div id="status">初期化中...</div>
<div id="chat"></div>

<form id="form">
  <textarea id="input" rows="1" placeholder="メッセージを入力..." disabled></textarea>
  <button id="send" type="submit" disabled>送信</button>
</form>

<script type="module">
  import { pipeline, TextStreamer } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5";

  // onnx/フォルダ・chat_template・KVキャッシュ付きで正しく公開されている公式モデル
  const MODEL_ID = "onnx-community/Qwen2.5-1.5B-Instruct";

  const statusEl = document.getElementById("status");
  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");

  const messages = [
    { role: "system", content: "You are a helpful assistant." }
  ];

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  let generator;

  async function detectWebGPU() {
    if (!("gpu" in navigator)) {
      console.warn("navigator.gpu が存在しません(WebGPU非対応ブラウザ)");
      return false;
    }
    try {
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        console.warn("navigator.gpu はあるが requestAdapter() が null を返した(GPU非対応/ドライバ問題など)");
        return false;
      }
      console.log("[WebGPU adapter]", adapter);
      return true;
    } catch (e) {
      console.warn("requestAdapter() でエラー", e);
      return false;
    }
  }

  async function init() {
    const hasWebGPU = await detectWebGPU();
    const device = hasWebGPU ? "webgpu" : "wasm";
    setStatus(`モデルを読み込み中 (device: ${device})...`);

    if (!hasWebGPU) {
      addMessage("system", "⚠️ WebGPUが使えないため device: \"wasm\" で動作します。1.5B以上のモデルはWASMだとメモリ不足で落ちる(Aborted)ことがあります。Chrome/Edgeの最新版 かつ https://(またはlocalhost)で開いているか確認してください。");
    }

    try {
      generator = await pipeline("text-generation", MODEL_ID, {
        dtype: device === "webgpu" ? "q4f16" : "q4",
        device,
        progress_callback: (data) => {
          if (data.status === "progress") {
            setStatus(`DL中: ${data.file} ${data.progress?.toFixed(0) ?? 0}%`);
          }
        },
      });
    } catch (err) {
      console.error(err);
      addMessage("system", "エラー: " + err.message);
      setStatus("読み込み失敗: " + err.message);
      return;
    }

    setStatus(`準備完了 (device: ${device})`);
    inputEl.disabled = false;
    sendEl.disabled = false;
    inputEl.focus();
  }

  async function send(text) {
    messages.push({ role: "user", content: text });
    addMessage("user", text);

    const botDiv = addMessage("bot", "");
    let acc = "";

    const streamer = new TextStreamer(generator.tokenizer, {
      skip_prompt: true,
      skip_special_tokens: true,
      callback_function: (chunk) => {
        acc += chunk;
        botDiv.textContent = acc;
        chatEl.scrollTop = chatEl.scrollHeight;
      },
    });

    sendEl.disabled = true;
    inputEl.disabled = true;
    setStatus("生成中...");

    try {
      // このモデルはtokenizer側にchat_templateが正しく設定されているので、
      // messages配列をそのまま渡すだけでOK
      const output = await generator(messages, {
        max_new_tokens: 512,
        do_sample: true,
        temperature: 0.7,
        top_p: 0.9,
        repetition_penalty: 1.3,   // 直前のトークンの繰り返しにペナルティ
        no_repeat_ngram_size: 3,   // 同じ3-gramの再出現を禁止
        streamer,
      });
      const reply = output[0].generated_text.at(-1).content;
      messages.push({ role: "assistant", content: reply });
      botDiv.textContent = reply;
    } catch (err) {
      console.error(err);
      botDiv.textContent = "エラーが発生しました: " + err.message;
    } finally {
      sendEl.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
      setStatus("準備完了");
    }
  }

  formEl.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    inputEl.style.height = "auto";
    send(text);
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  init();
</script>

</body>
</html>
