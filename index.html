<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serow Qwen2.5 0.5B (ONNX) デモ</title>
    <!-- Import Map: Transformers.js を CDN から読み込む -->
    <script type="importmap">
        {
            "imports": {
                "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.min.js"
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f9fafb;
            color: #1f2937;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            font-size: 0.8rem;
            background: #e5e7eb;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 400;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .status-bar {
            background: #f3f4f6;
            border-radius: 8px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin: 16px 0;
        }
        .status-bar-fill {
            height: 100%;
            width: 0%;
            background: #3b82f6;
            transition: width 0.2s ease;
            border-radius: 8px;
        }
        #status-text {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 4px;
            min-height: 1.5em;
        }
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1 1 auto;
        }
        button:hover:not(:disabled) {
            background: #2563eb;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        button.secondary {
            background: #e5e7eb;
            color: #1f2937;
        }
        button.secondary:hover:not(:disabled) {
            background: #d1d5db;
        }
        #output {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 100px;
            line-height: 1.6;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #9ca3af;
            text-align: center;
        }
        .error-text {
            color: #dc2626;
            background: #fee2e2;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <h1>
        🐉 Serow Qwen2.5 0.5B
        <span class="badge">ONNX / Web</span>
    </h1>
    <p>ブラウザ上で動作する軽量チャットAIです。初回ロード時はモデル（約1GB）のダウンロードが発生します。</p>

    <div class="card">
        <!-- 進捗バー -->
        <div class="status-bar">
            <div id="progress-fill" class="status-bar-fill"></div>
        </div>
        <div id="status-text">💡 「生成する」ボタンを押すとモデルを読み込みます。</div>

        <!-- 入力エリア -->
        <textarea id="user-input" rows="3" placeholder="メッセージを入力してください... (例: こんにちは！)">こんにちは！今日はどんな一日でしたか？</textarea>
        
        <div class="button-group">
            <button id="generate-btn">🚀 生成する</button>
            <button id="clear-btn" class="secondary">🗑️ クリア</button>
        </div>

        <!-- 出力エリア -->
        <div id="output">ここに応答が表示されます。</div>
    </div>

    <div class="footer">
        Model: <a href="https://huggingface.co/WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-ONNX" target="_blank">WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-ONNX</a>
        | Powered by Transformers.js
    </div>

    <script type="module">
        // --- JavaScript メインロジック ---
        import { pipeline } from '@huggingface/transformers';

        // DOM 要素の参照
        const statusText = document.getElementById('status-text');
        const progressFill = document.getElementById('progress-fill');
        const outputDiv = document.getElementById('output');
        const userInput = document.getElementById('user-input');
        const generateBtn = document.getElementById('generate-btn');
        const clearBtn = document.getElementById('clear-btn');

        // モデルID（あなたのHugging Faceリポジトリ）
        const MODEL_ID = 'WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-ONNX';

        // グローバルにパイプラインを保持（再読み込み防止）
        let generator = null;
        let isLoading = false;

        // --- 進捗表示の更新関数 ---
        function updateProgress(progress) {
            if (progress === undefined || progress === null) return;
            const percent = Math.min(100, Math.round(progress * 100));
            progressFill.style.width = `${percent}%`;
            if (percent < 100) {
                statusText.textContent = `⏳ モデルをダウンロード中... ${percent}%`;
            } else {
                statusText.textContent = '✅ モデルの読み込みが完了しました！';
            }
        }

        // --- モデルの読み込み関数 (初回のみ実行) ---
        async function loadModel() {
            if (generator) return generator;
            if (isLoading) {
                statusText.textContent = '⏳ すでに読み込み中です... お待ちください。';
                return null;
            }

            isLoading = true;
            generateBtn.disabled = true;
            statusText.textContent = '⏳ モデルを初期化しています... (初回は数分かかります)';
            progressFill.style.width = '0%';

            try {
                // ★★★ 修正ポイント ★★★
                // model_file_name を pipeline のルートオプションとして正しく指定
                generator = await pipeline('text-generation', MODEL_ID, {
                    // ここが正しい配置場所です（progress_callback の外側）
                    model_file_name: 'model.onnx',

                    // 進捗コールバック
                    progress_callback: (data) => {
                        if (data.status === 'progress') {
                            updateProgress(data.progress);
                        } else if (data.status === 'done') {
                            progressFill.style.width = '100%';
                            statusText.textContent = '✅ モデルの準備が整いました！';
                            generateBtn.disabled = false;
                        } else if (data.status === 'error') {
                            statusText.textContent = `❌ エラー: ${data.error || '不明なエラー'}`;
                            generateBtn.disabled = true;
                        }
                    },
                    // モデルのデータ型指定（あなたのONNXはfp16でエクスポート済み）
                    dtype: 'fp16',
                });

                // 読み込み完了後の最終処理
                progressFill.style.width = '100%';
                statusText.textContent = '✅ モデルの準備が整いました！';
                generateBtn.disabled = false;
                isLoading = false;
                return generator;

            } catch (error) {
                console.error('モデル読み込みエラー:', error);
                statusText.innerHTML = `<span class="error-text">❌ 読み込みに失敗しました: ${error.message}</span>`;
                generateBtn.disabled = true;
                isLoading = false;
                throw error;
            }
        }

        // --- テキスト生成の実行 ---
        async function generateText() {
            const inputText = userInput.value.trim();
            if (!inputText) {
                outputDiv.textContent = '⚠️ テキストを入力してください。';
                return;
            }

            // ボタンを無効化（連打防止）
            generateBtn.disabled = true;
            outputDiv.textContent = '⏳ 考え中... (推論には少し時間がかかります)';

            try {
                // 1. モデルが読み込まれていることを確認
                const gen = await loadModel();
                if (!gen) {
                    outputDiv.textContent = '❌ モデルの読み込みに失敗しました。再読み込みしてください。';
                    generateBtn.disabled = false;
                    return;
                }

                // 2. Qwen2.5 用のチャットメッセージ形式
                //    Transformers.js は内部で apply_chat_template を呼び出してくれます
                const messages = [
                    { role: 'system', content: 'あなたは親切で役立つアシスタントです。' },
                    { role: 'user', content: inputText }
                ];

                // 3. 推論実行
                const startTime = performance.now();
                const result = await gen(messages, {
                    max_new_tokens: 256,
                    do_sample: true,
                    temperature: 0.7,
                    top_p: 0.9,
                    repetition_penalty: 1.1,
                });
                const endTime = performance.now();
                const timeSec = ((endTime - startTime) / 1000).toFixed(1);

                // 4. 結果を整形して表示
                if (result && result.length > 0) {
                    let fullText = result[0].generated_text;
                    
                    // アシスタントの返答だけを抽出する試み（Qwen2.5 の特殊トークンに対応）
                    // 注: Transformers.js のバージョンによって挙動が異なる場合があります
                    const assistantTag = '<|im_start|>assistant';
                    let reply = fullText;
                    if (fullText.includes(assistantTag)) {
                        // 最後のアシスタントセクションを抽出
                        const parts = fullText.split(assistantTag);
                        reply = parts[parts.length - 1].replace(/<\|im_end\|>/g, '').trim();
                        // システムプロンプトが残っている場合の簡易対処
                        if (reply.includes('<|im_start|>')) {
                            reply = fullText; // フォールバック: 全体表示
                        }
                    }
                    
                    outputDiv.textContent = reply || '(応答が空でした)';
                    
                    // 生成時間を追記（デバッグ用）
                    outputDiv.textContent += `\n\n--- ⏱️ ${timeSec}秒 ---`;
                } else {
                    outputDiv.textContent = '⚠️ 応答が取得できませんでした。';
                }

            } catch (error) {
                console.error('推論エラー:', error);
                outputDiv.innerHTML = `<span class="error-text">❌ エラーが発生しました: ${error.message}</span>`;
            } finally {
                // ボタンを再度有効化
                generateBtn.disabled = false;
            }
        }

        // --- UI イベントのバインド ---
        generateBtn.addEventListener('click', generateText);

        clearBtn.addEventListener('click', () => {
            userInput.value = '';
            outputDiv.textContent = 'ここに応答が表示されます。';
        });

        // Enterキーで送信 (Shift+Enterで改行)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateBtn.click();
            }
        });

        // 初期状態ではボタンを有効にしておく（押すと読み込み開始）
        generateBtn.disabled = false;
        console.log('✅ アプリ準備完了！モデルID:', MODEL_ID);
        console.log('ℹ️ 注意: このモデルは ONNX フォーマットでエクスポートされています。');
    </script>
</body>
</html>
