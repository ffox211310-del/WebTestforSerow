<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serow-Qwen2.5-0.5B Chat (Transformers.js)</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #6ea8fe;
    --user-bubble: #2a3550;
    --bot-bubble: #22252c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  header h1 { font-size: 15px; margin: 0; }
  header .model-id { font-size: 12px; color: var(--muted); word-break: break-all; }
  #status {
    font-size: 12px;
    color: var(--muted);
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
  }
  #progress-wrap {
    padding: 0 16px;
  }
  #progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin: 6px 0 10px;
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.15s ease;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 12px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 2px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-left-radius: 2px;
  }
  .msg.system {
    align-self: center;
    color: var(--muted);
    font-size: 12px;
    background: none;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
  }
  button {
    background: var(--accent);
    color: #0b0f1a;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<header>
  <h1>Serow-Qwen2.5-0.5B-Instruct チャット</h1>
  <div class="model-id">WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-ONNX · Transformers.js</div>
</header>

<div id="status">初期化中...</div>
<div id="progress-wrap">
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<div id="chat"></div>

<form id="form">
  <textarea id="input" rows="1" placeholder="メッセージを入力..." disabled></textarea>
  <button id="send" type="submit" disabled>送信</button>
</form>

<script type="module">
  import { pipeline, TextStreamer } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5";

  const MODEL_ID = "WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-ONNX";

  const statusEl = document.getElementById("status");
  const progressFill = document.getElementById("progress-fill");
  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");

  const messages = [
    { role: "system", content: "You are a helpful assistant." }
  ];

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  // モデルごとにダウンロード進捗を集計して表示
  const fileProgress = new Map();
  function onProgress(data) {
    if (data.status === "progress" && typeof data.progress === "number") {
      fileProgress.set(data.file, data.progress);
      const values = [...fileProgress.values()];
      const avg = values.reduce((a, b) => a + b, 0) / values.length;
      progressFill.style.width = avg.toFixed(1) + "%";
      setStatus(`モデルをダウンロード中... ${avg.toFixed(0)}%`);
    } else if (data.status === "done") {
      setStatus(`読み込み完了: ${data.file}`);
    }
  }

  let generator;

  async function init() {
    // WebGPUが使えるかチェックし、ダメならWASMにフォールバック
    const hasWebGPU = "gpu" in navigator;
    const device = hasWebGPU ? "webgpu" : "wasm";
    setStatus(`モデルを読み込み中 (device: ${device})...`);

    try {
      generator = await pipeline("text-generation", MODEL_ID, {
        dtype: device === "webgpu" ? "q4f16" : "q4",
        device,
        progress_callback: onProgress,
      });
    } catch (err) {
      console.error(err);
      // WebGPU読み込み失敗時はWASMで再試行
      if (device === "webgpu") {
        setStatus("WebGPUでの読み込みに失敗。WASMで再試行します...");
        generator = await pipeline("text-generation", MODEL_ID, {
          dtype: "q4",
          device: "wasm",
          progress_callback: onProgress,
        });
      } else {
        setStatus("モデルの読み込みに失敗しました: " + err.message);
        addMessage("system", "エラー: " + err.message);
        return;
      }
    }

    progressFill.style.width = "100%";
    setStatus(`準備完了 (device: ${generator.model?.device ?? device})`);
    inputEl.disabled = false;
    sendEl.disabled = false;
    inputEl.focus();
  }

  async function send(text) {
    messages.push({ role: "user", content: text });
    addMessage("user", text);

    const botDiv = addMessage("bot", "");
    let acc = "";

    const streamer = new TextStreamer(generator.tokenizer, {
      skip_prompt: true,
      skip_special_tokens: true,
      callback_function: (chunk) => {
        acc += chunk;
        botDiv.textContent = acc;
        chatEl.scrollTop = chatEl.scrollHeight;
      },
    });

    sendEl.disabled = true;
    inputEl.disabled = true;
    setStatus("生成中...");

    try {
      const output = await generator(messages, {
        max_new_tokens: 512,
        do_sample: false,
        streamer,
      });
      const reply = output[0].generated_text.at(-1).content;
      messages.push({ role: "assistant", content: reply });
      botDiv.textContent = reply;
    } catch (err) {
      console.error(err);
      botDiv.textContent = "エラーが発生しました: " + err.message;
    } finally {
      sendEl.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
      setStatus("準備完了");
    }
  }

  formEl.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    inputEl.style.height = "auto";
    send(text);
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  init();
</script>

</body>
</html>
